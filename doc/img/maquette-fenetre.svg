<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f3460"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="600" fill="#eef1f6"/>

  <!-- Fenêtre -->
  <rect x="12" y="12" width="936" height="576" rx="8" ry="8" fill="#ffffff" stroke="#b9c2d4" stroke-width="1.5"/>
  <rect x="12" y="12" width="936" height="36" rx="8" ry="8" fill="#1a1a2e"/>
  <rect x="12" y="40" width="936" height="8" fill="#1a1a2e"/>
  <text x="30" y="36" fill="#ffffff" font-size="14" font-weight="600">P-Fun — Visualiseur de séries temporelles</text>
  <circle cx="882" cy="30" r="5" fill="#8a93a8"/>
  <circle cx="900" cy="30" r="5" fill="#8a93a8"/>
  <circle cx="918" cy="30" r="5" fill="#8a93a8"/>

  <!-- Panneau latéral -->
  <rect x="12" y="48" width="232" height="540" fill="#f5f7fb" stroke="#e0e5ee" stroke-width="1"/>
  <text x="30" y="76" fill="#1a1a2e" font-size="13" font-weight="700" letter-spacing="0.4">SÉRIES</text>

  <!-- Cases à cocher -->
  <g font-size="12" fill="#1a1a2e">
    <rect x="30" y="94" width="14" height="14" rx="3" fill="#ffffff" stroke="#7a869c"/>
    <path d="M33 101 l3 3 l5 -6" fill="none" stroke="#0f3460" stroke-width="2"/>
    <text x="52" y="106">BTC (181 954)</text>

    <rect x="30" y="128" width="14" height="14" rx="3" fill="#ffffff" stroke="#7a869c"/>
    <path d="M33 135 l3 3 l5 -6" fill="none" stroke="#0f3460" stroke-width="2"/>
    <text x="52" y="140">ETH (181 954)</text>

    <rect x="30" y="162" width="14" height="14" rx="3" fill="#ffffff" stroke="#7a869c"/>
    <path d="M33 169 l3 3 l5 -6" fill="none" stroke="#0f3460" stroke-width="2"/>
    <text x="52" y="174">EUR (181 954)</text>

    <rect x="30" y="196" width="14" height="14" rx="3" fill="#ffffff" stroke="#7a869c"/>
    <path d="M33 203 l3 3 l5 -6" fill="none" stroke="#0f3460" stroke-width="2"/>
    <text x="52" y="208">GOLD (181 954)</text>

    <rect x="30" y="230" width="14" height="14" rx="3" fill="#ffffff" stroke="#7a869c"/>
    <path d="M33 237 l3 3 l5 -6" fill="none" stroke="#0f3460" stroke-width="2"/>
    <text x="52" y="242">SOLU (181 954)</text>
  </g>

  <line x1="30" y1="266" x2="226" y2="266" stroke="#dde3ed" stroke-width="1"/>

  <!-- Base 100 -->
  <rect x="30" y="282" width="14" height="14" rx="3" fill="#ffffff" stroke="#7a869c"/>
  <path d="M33 289 l3 3 l5 -6" fill="none" stroke="#0f3460" stroke-width="2"/>
  <text x="52" y="294" font-size="12" fill="#1a1a2e">Comparer (base 100)</text>

  <!-- Bouton import -->
  <rect x="30" y="318" width="194" height="32" rx="5" fill="#1a1a2e"/>
  <text x="127" y="339" fill="#ffffff" font-size="11.5" text-anchor="middle">Importer un dossier JSON…</text>

  <!-- État -->
  <text x="30" y="382" font-size="11" fill="#3b4559">Séries en base :</text>
  <text x="30" y="398" font-size="11" fill="#3b4559">BTC, ETH, EUR, GOLD, SOLU</text>

  <text x="30" y="446" font-size="11" fill="#3b4559">Base : p-fun.db</text>
  <text x="30" y="462" font-size="11" fill="#3b4559">909 770 bougies — 24 Mo</text>

  <!-- Zone de graphique -->
  <rect x="252" y="56" width="688" height="524" fill="#ffffff" stroke="#e0e5ee"/>
  <text x="596" y="82" font-size="12.5" fill="#1a1a2e" text-anchor="middle" font-weight="600">5/5 série(s) tracée(s) — base 100 — p-fun.db</text>

  <!-- Axes -->
  <line x1="330" y1="430" x2="900" y2="430" stroke="#8a93a8" stroke-width="1"/>
  <line x1="330" y1="430" x2="330" y2="110" stroke="#8a93a8" stroke-width="1"/>
  <g stroke="#eef1f6" stroke-width="1">
    <line x1="330" y1="168" x2="900" y2="168"/>
    <line x1="330" y1="226" x2="900" y2="226"/>
    <line x1="330" y1="284" x2="900" y2="284"/>
    <line x1="330" y1="342" x2="900" y2="342"/>
    <line x1="330" y1="400" x2="900" y2="400"/>
  </g>
  <g font-size="10" fill="#6b7689" text-anchor="end">
    <text x="322" y="433">90</text>
    <text x="322" y="403">95</text>
    <text x="322" y="345">100</text>
    <text x="322" y="287">105</text>
    <text x="322" y="229">110</text>
    <text x="322" y="171">115</text>
  </g>
  <g font-size="10" fill="#6b7689" text-anchor="middle">
    <text x="360" y="450">01/09</text>
    <text x="470" y="450">08/09</text>
    <text x="580" y="450">15/09</text>
    <text x="690" y="450">22/09</text>
    <text x="800" y="450">28/09</text>
  </g>
  <text x="615" y="476" font-size="11" fill="#3b4559" text-anchor="middle">Temps</text>
  <text x="292" y="270" font-size="11" fill="#3b4559" text-anchor="middle" transform="rotate(-90 292 270)">Indice (base 100)</text>

  <!-- Courbes (indices base 100) -->
  <path d="M340 300 L380 292 L420 306 L460 288 L500 296 L540 276 L580 282 L620 262 L660 270 L700 248 L740 256 L780 238 L820 244 L860 226 L895 232"
        fill="none" stroke="#1f77b4" stroke-width="2"/>
  <path d="M340 318 L380 326 L420 310 L460 318 L500 300 L540 310 L580 292 L620 302 L660 286 L700 296 L740 280 L780 290 L820 272 L860 282 L895 266"
        fill="none" stroke="#ff7f0e" stroke-width="2"/>
  <path d="M340 286 L380 280 L420 290 L460 276 L500 284 L540 268 L580 274 L620 258 L660 266 L700 252 L740 260 L780 244 L820 252 L860 236 L895 240"
        fill="none" stroke="#2ca02c" stroke-width="2"/>
  <path d="M340 330 L380 322 L420 334 L460 320 L500 330 L540 316 L580 324 L620 308 L660 316 L700 304 L740 312 L780 298 L820 306 L860 294 L895 300"
        fill="none" stroke="#d62728" stroke-width="2"/>
  <path d="M340 306 L380 314 L420 298 L460 306 L500 290 L540 298 L580 280 L620 288 L660 274 L700 282 L740 268 L780 276 L820 260 L860 268 L895 254"
        fill="none" stroke="#9467bd" stroke-width="2"/>

  <!-- Légende -->
  <rect x="640" y="96" width="286" height="94" fill="#ffffff" fill-opacity="0.94" stroke="#e0e5ee"/>
  <g font-size="10" fill="#1a1a2e">
    <line x1="650" y1="110" x2="672" y2="110" stroke="#1f77b4" stroke-width="2.5"/><text x="680" y="114">BTC (réf. 59 806)</text>
    <line x1="650" y1="128" x2="672" y2="128" stroke="#ff7f0e" stroke-width="2.5"/><text x="680" y="132">ETH (réf. 2 956)</text>
    <line x1="650" y1="146" x2="672" y2="146" stroke="#2ca02c" stroke-width="2.5"/><text x="680" y="150">EUR (réf. 1,14)</text>
    <line x1="650" y1="164" x2="672" y2="164" stroke="#d62728" stroke-width="2.5"/><text x="680" y="168">GOLD (réf. 4 042)</text>
    <line x1="650" y1="182" x2="672" y2="182" stroke="#9467bd" stroke-width="2.5"/><text x="680" y="186">SOLU (réf. 132)</text>
  </g>

  <!-- Repères numérotés -->
  <g font-size="11" font-weight="700">
    <circle cx="216" cy="104" r="10" fill="#0f3460" stroke="#ffffff" stroke-width="2"/><text x="216" y="108" fill="#ffffff" text-anchor="middle">1</text>
    <circle cx="228" cy="289" r="10" fill="#0f3460" stroke="#ffffff" stroke-width="2"/><text x="228" y="293" fill="#ffffff" text-anchor="middle">2</text>
    <circle cx="228" cy="366" r="10" fill="#0f3460" stroke="#ffffff" stroke-width="2"/><text x="228" y="370" fill="#ffffff" text-anchor="middle">3</text>
    <circle cx="228" cy="454" r="10" fill="#0f3460" stroke="#ffffff" stroke-width="2"/><text x="228" y="458" fill="#ffffff" text-anchor="middle">4</text>
    <circle cx="905" cy="86" r="10" fill="#0f3460" stroke="#ffffff" stroke-width="2"/><text x="905" y="90" fill="#ffffff" text-anchor="middle">5</text>
  </g>
</svg>
