    <line x1="540" y1="164" x2="920" y2="164"/>
    <line x1="540" y1="208" x2="920" y2="208"/>
    <line x1="540" y1="252" x2="920" y2="252"/>
    <line x1="540" y1="296" x2="920" y2="296"/>
