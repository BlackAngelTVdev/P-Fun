  <line x1="830" y1="154" x2="830" y2="196" stroke="#1a1a2e" stroke-width="1" stroke-dasharray="3 2"/>
  <circle cx="830" cy="200" r="4" fill="#1f77b4" stroke="#ffffff" stroke-width="1.5"/>

