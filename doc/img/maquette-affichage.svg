  <circle cx="241" cy="235" r="11" fill="none" stroke="#0f3460" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="250" y1="228" x2="292" y2="196" stroke="#0f3460" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="298" y="190" font-size="9.5" fill="#0f3460">trou de données : les blocs</text>
  <text x="298" y="202" font-size="9.5" fill="#0f3460">ne sont pas reliés</text>

