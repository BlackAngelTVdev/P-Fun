  <text x="540" y="384" font-size="10" fill="#1f77b4" text-anchor="start">BTC (USDT) — axe de gauche</text>
  <text x="920" y="384" font-size="10" fill="#2ca02c" text-anchor="end">EUR (USDT) — axe de droite</text>
  <text x="730" y="364" font-size="10" fill="#3b4559" text-anchor="middle">Temps</text>
  <g font-size="9.5" fill="#6b7689" text-anchor="middle">
    <text x="560" y="356">01/09</text>
    <text x="650" y="356">10/09</text>
    <text x="740" y="356">17/09</text>
    <text x="830" y="356">24/09</text>
    <text x="910" y="356">28/09</text>
  </g>

  <!-- BTC sur l'axe de gauche -->
  <path d="M550 300 L590 288 L630 306 L670 280 L710 292 L750 262 L790 272 L830 246 L870 256 L910 232"
