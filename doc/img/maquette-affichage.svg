  <path d="M70 246 L110 240 L150 250 L190 236 L220 242" fill="none" stroke="#2ca02c" stroke-width="2"/>
  <path d="M262 228 L300 234 L340 218 L380 226 L430 208" fill="none" stroke="#2ca02c" stroke-width="2"/>
  <path d="M70 302 L110 294 L150 306 L190 292 L230 302 L270 288 L310 296 L350 280 L390 288 L430 274"
