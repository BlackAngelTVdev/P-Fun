  <text x="240" y="58" font-size="10.5" fill="#5b6679" text-anchor="middle">les cinq séries partent de 100 : elles deviennent superposables</text>

  <line x1="60" y1="340" x2="440" y2="340" stroke="#8a93a8"/>
  <line x1="60" y1="340" x2="60" y2="86" stroke="#8a93a8"/>
  <g stroke="#eef1f6">
    <line x1="60" y1="120" x2="440" y2="120"/>
    <line x1="60" y1="164" x2="440" y2="164"/>
    <line x1="60" y1="208" x2="440" y2="208"/>
    <line x1="60" y1="252" x2="440" y2="252"/>
    <line x1="60" y1="296" x2="440" y2="296"/>
