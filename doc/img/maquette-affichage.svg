  <!-- EUR sur l'axe de droite -->
  <path d="M550 250 L590 258 L630 240 L670 248 L710 230 L750 240 L790 220 L830 230 L870 214 L910 224"
        fill="none" stroke="#2ca02c" stroke-width="2"/>

  <!-- Infobulle -->
  <rect x="742" y="88" width="164" height="66" rx="6" fill="#1a1a2e"/>
  <g font-size="9.5" fill="#ffffff">
    <text x="752" y="105" font-weight="600">BTC — 28/09/2026 08:00</text>
    <text x="752" y="120">83 218 USDT</text>
